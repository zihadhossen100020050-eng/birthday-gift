<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#170d2e" />
  <title>Happy Birthday! 🎂</title>
  <style>
    :root {
      --pink: #ff75b5;
      --gold: #ffd166;
      --cream: #fff8f0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--cream);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,117,181,.23), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(125,90,255,.28), transparent 35%),
        linear-gradient(145deg, #10091f, #241044 55%, #11152e);
      display: grid;
      place-items: center;
      padding: 22px 14px;
    }
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background-image:
        radial-gradient(2px 2px at 12% 24%, white 50%, transparent 55%),
        radial-gradient(2px 2px at 78% 16%, white 50%, transparent 55%),
        radial-gradient(1.5px 1.5px at 88% 65%, white 50%, transparent 55%),
        radial-gradient(2px 2px at 24% 83%, white 50%, transparent 55%),
        radial-gradient(1.5px 1.5px at 61% 90%, white 50%, transparent 55%),
        radial-gradient(2px 2px at 46% 9%, white 50%, transparent 55%);
    }
    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
      padding: clamp(24px, 6vw, 44px) clamp(18px, 5vw, 38px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.19);
      border-radius: 28px;
      background: rgba(255,255,255,.085);
      box-shadow: 0 24px 80px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: cardIn .9s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(22px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cake {
      display: inline-block;
      font-size: clamp(58px, 15vw, 84px);
      line-height: 1.2;
      filter: drop-shadow(0 8px 18px rgba(255,117,181,.25));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-9px) rotate(3deg); }
    }
    .eyebrow {
      margin: 14px 0 8px;
      color: var(--gold);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 9vw, 4.2rem);
      line-height: 1.05;
      letter-spacing: -.045em;
      background: linear-gradient(100deg, #fff4c2, #ff8fc7 48%, #c5b5ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 22px rgba(255,117,181,.2));
    }
    .name {
      margin: 14px 0 0;
      color: #fff;
      font-size: clamp(1.3rem, 5vw, 1.9rem);
      font-weight: 750;
      overflow-wrap: anywhere;
    }
    .message {
      max-width: 390px;
      margin: 18px auto 0;
      color: rgba(255,248,240,.88);
      font-size: clamp(.97rem, 3.7vw, 1.08rem);
      line-height: 1.8;
    }
    .divider {
      width: 76px;
      height: 3px;
      margin: 24px auto;
      border-radius: 9px;
      background: linear-gradient(90deg, var(--pink), var(--gold));
    }
    .wish {
      margin: 0;
      color: #ffe6f2;
      font-size: .95rem;
      line-height: 1.8;
    }
    button {
      margin-top: 27px;
      width: 100%;
      max-width: 290px;
      min-height: 52px;
      padding: 14px 20px;
      border: 0;
      border-radius: 999px;
      color: #25102f;
      background: linear-gradient(100deg, #ffd166, #ff8fc7);
      font: inherit;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 9px 26px rgba(255,117,181,.23);
      transition: transform .2s ease, box-shadow .2s ease;
      touch-action: manipulation;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 13px 32px rgba(255,117,181,.34); }
    button:active { transform: scale(.98); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .footer { margin: 22px 0 0; color: rgba(255,255,255,.55); font-size: .78rem; }
    @media (max-width: 380px) {
      .card { border-radius: 22px; }
      .eyebrow { letter-spacing: .15em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main class="card">
    <div class="cake" aria-hidden="true">🎂</div>
    <p class="eyebrow">A special day for someone special</p>
    <h1>Happy Birthday!</h1>
    <p class="name" id="birthday-name">Dear Friend 💖</p>
    <p class="message">
      May your day be filled with love, laughter, and beautiful surprises.
      May the year ahead bring you happiness, success, and countless reasons to smile.
    </p>
    <div class="divider"></div>
    <p class="wish">Keep shining, keep smiling, and never stop being amazing. ✨</p>
    <button id="celebrate" type="button">🎉 Celebrate Again</button>
    <p class="footer">Made with love 💗</p>
  </main>

  <script>
    // Personalize the wish by changing "Dear Friend" to the birthday person's name.
    // Example: document.getElementById("birthday-name").textContent = "Dear Ayesha 💖";

    (() => {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      const button = document.getElementById("celebrate");
      const colors = ["#ff75b5", "#ffd166", "#9bf6ff", "#c5b5ff", "#b8f7c5", "#ffffff"];
      let pieces = [];
      let width = 0, height = 0, raf = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function burst(amount = 150) {
        const originX = width * (0.2 + Math.random() * 0.6);
        const originY = height * (0.12 + Math.random() * 0.24);
        for (let i = 0; i < amount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 6;
          pieces.push({
            x: originX, y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2.5,
            gravity: 0.075 + Math.random() * 0.09,
            size: 4 + Math.random() * 7,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * Math.PI,
            spin: (Math.random() - 0.5) * 0.22,
            life: 170 + Math.random() * 70,
            shape: Math.random() > 0.5 ? "rect" : "circle"
          });
        }
        if (!raf) animate();
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        pieces = pieces.filter(p => p.life > 0 && p.y < height + 30);
        for (const p of pieces) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= 0.995;
          p.rotation += p.spin;
          p.life--;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.globalAlpha = Math.min(1, p.life / 35);
          ctx.fillStyle = p.color;
          if (p.shape === "rect") {
            ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.62);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
        if (pieces.length) {
          raf = requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, width, height);
          raf = 0;
        }
      }

      window.addEventListener("resize", resize, { passive: true });
      button.addEventListener("click", () => burst(190));
      resize();
      burst(180);
      setTimeout(() => burst(100), 650);
    })();
  </script>
</body>
</html>
